<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>登录 · pi-web</title><link rel="stylesheet" href="/assets/styles.CXQ82VDt.css">
<style>.account-page{margin:0;min-height:100vh;overflow:auto;background:var(--bg-0);color:var(--fg-0)}.account-main{width:min(100% - 40px,1000px);margin:0 auto;padding:32px 0 64px}.account-header,.account-heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.account-header{padding-bottom:24px;border-bottom:1px solid var(--border);font-size:13px}.account-header a{font-weight:700}.account-main a{color:var(--accent);text-underline-offset:4px}.account-heading{margin:32px 0 24px}.account-main h1{font-size:26px;margin:0 0 12px;letter-spacing:-.03em}.account-main h2{font-size:18px;margin:0 0 20px}.account-main p{line-height:1.7;color:var(--fg-2)}.account-card{padding:28px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px}.account-login{max-width:460px;margin:64px auto 0;border-top:3px solid var(--accent)}.account-columns{display:grid;grid-template-columns:1fr 1.6fr;gap:24px}.account-main fieldset{display:grid;gap:18px;border:0;padding:0;margin:0;min-width:0}.account-main label{display:grid;gap:8px;font-size:13px}.account-main input:not([type=checkbox]){box-sizing:border-box;width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;color:var(--fg-0);background:var(--bg-0);font:inherit}.account-main input:read-only{color:var(--fg-3)}.account-main button{min-height:40px;padding:9px 14px;font:inherit;border:1px solid var(--border);border-radius:6px;color:var(--fg-0);background:var(--bg-0);cursor:pointer}.account-main button:disabled{opacity:.5;cursor:wait}.account-main .account-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.account-main .account-danger{color:var(--danger)}.account-main :focus-visible{outline:2px solid var(--accent);outline-offset:3px}.account-main small{display:block;font-size:12px;color:var(--fg-3);line-height:1.7}.account-login small{margin-top:24px}.account-users{padding:0;list-style:none;display:grid;gap:10px}.account-users button{text-align:left;width:100%;overflow-wrap:anywhere}.account-form-actions{display:flex;gap:12px;flex-wrap:wrap}.account-workspaces{display:grid;gap:12px;max-height:280px;overflow:auto;padding:4px}.account-workspaces label{grid-template-columns:auto 1fr;align-items:start;overflow-wrap:anywhere}.account-main legend{margin-bottom:12px;font-size:13px}.account-main [role=alert]{color:var(--danger)}.account-main [hidden]{display:none}.account-main dialog{width:min(440px,calc(100vw - 64px));padding:28px;border:1px solid var(--border);border-radius:12px;background:var(--bg-0);color:var(--fg-0)}.account-main dialog::backdrop{background:#0006}@media(max-width:680px){.account-columns{grid-template-columns:1fr}.account-card{padding:20px}.account-header span{display:none}.account-heading{align-items:flex-start}.account-login{margin-top:32px}}
</style></head> <body class="account-page"> <main class="account-main"> <header class="account-header"><a href="/">pi.dev / web</a><span>账号与访问权限</span></header>  <section class="account-card account-login"> <h1 data-login-title>登录工作区</h1> <p data-login-hint>使用管理员分配的账号登录。会话仅对本人可见。</p> <form data-login-form> <fieldset disabled data-login-fields> <label>用户名<input name="username" autocomplete="username" required maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}"></label> <label>密码<input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"></label> <label data-confirmation hidden>确认管理员密码<input name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128"></label> <button type="submit" class="account-primary" data-login-submit>登录</button> </fieldset> </form> <small>工作区由管理员分配，普通用户不能自行添加。仅提供应用权限隔离，不提供终端沙箱。</small> </section>  <p role="alert" aria-live="polite" data-account-error></p> </main> </body></html> <script type="module" src="/assets/login.astro_astro_type_script_index_0_lang.CvAvOk-f.js"></script>
