<!DOCTYPE html><html lang="zh-CN"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>用户管理 · pi-web</title><link rel="stylesheet" href="/assets/styles.CXQ82VDt.css">
<style>.account-page{margin:0;min-height:100vh;overflow:auto;background:var(--bg-0);color:var(--fg-0)}.account-main{width:min(100% - 40px,1000px);margin:0 auto;padding:32px 0 64px}.account-header,.account-heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.account-header{padding-bottom:24px;border-bottom:1px solid var(--border);font-size:13px}.account-header a{font-weight:700}.account-main a{color:var(--accent);text-underline-offset:4px}.account-heading{margin:32px 0 24px}.account-main h1{font-size:26px;margin:0 0 12px;letter-spacing:-.03em}.account-main h2{font-size:18px;margin:0 0 20px}.account-main p{line-height:1.7;color:var(--fg-2)}.account-card{padding:28px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px}.account-login{max-width:460px;margin:64px auto 0;border-top:3px solid var(--accent)}.account-columns{display:grid;grid-template-columns:1fr 1.6fr;gap:24px}.account-main fieldset{display:grid;gap:18px;border:0;padding:0;margin:0;min-width:0}.account-main label{display:grid;gap:8px;font-size:13px}.account-main input:not([type=checkbox]){box-sizing:border-box;width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;color:var(--fg-0);background:var(--bg-0);font:inherit}.account-path-row{display:grid;grid-template-columns:1fr auto;gap:8px}.account-directory-current{display:flex;gap:8px;margin:0 0 16px;overflow-wrap:anywhere;color:var(--fg-2);font-size:12px}.account-directory-current code{overflow-wrap:anywhere;color:var(--fg-0);font-family:var(--font-mono, monospace)}.account-directory-list{display:grid;gap:8px;max-height:300px;overflow:auto;margin:16px 0}.account-directory-list button{text-align:left}.account-main input:read-only{color:var(--fg-3)}.account-main button{min-height:40px;padding:9px 14px;font:inherit;border:1px solid var(--border);border-radius:6px;color:var(--fg-0);background:var(--bg-0);cursor:pointer}.account-main button:disabled{opacity:.5;cursor:wait}.account-main .account-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.account-main .account-danger{color:var(--danger)}.account-main :focus-visible{outline:2px solid var(--accent);outline-offset:3px}.account-main small{display:block;font-size:12px;color:var(--fg-3);line-height:1.7}.account-login small{margin-top:24px}.account-users{padding:0;list-style:none;display:grid;gap:10px}.account-users button{text-align:left;width:100%;overflow-wrap:anywhere}.account-form-actions{display:flex;gap:12px;flex-wrap:wrap}.account-workspaces{display:grid;gap:12px;max-height:280px;overflow:auto;padding:4px}.account-workspaces label{grid-template-columns:auto 1fr;align-items:start;overflow-wrap:anywhere}.account-main legend{margin-bottom:12px;font-size:13px}.account-main [role=alert]{color:var(--danger)}.account-main [hidden]{display:none}.account-main dialog{width:min(440px,calc(100vw - 64px));padding:28px;border:1px solid var(--border);border-radius:12px;background:var(--bg-0);color:var(--fg-0)}.account-main dialog::backdrop{background:#0006}@media(max-width:680px){.account-columns{grid-template-columns:1fr}.account-card{padding:20px}.account-header span{display:none}.account-heading{align-items:flex-start}.account-login{margin-top:32px}}
</style></head> <body class="account-page"> <main class="account-main"> <header class="account-header"><a href="/">pi.dev / web</a><span>账号与访问权限</span></header>  <div data-users-content hidden> <div class="account-heading"><div><h1>用户管理</h1><p>分配工作区，隔离个人会话。共享工作区内的文件仍然共享。</p></div><a href="/">返回会话</a></div> <div class="account-columns"> <section class="account-card"> <h2>用户列表</h2> <p data-users-empty>尚未创建用户。</p> <ul class="account-users" data-users-list></ul> <button type="button" data-user-new>创建用户</button> </section> <section class="account-card"> <h2 data-user-form-title>创建用户</h2> <form data-user-form> <fieldset data-user-fields> <label>用户名<input name="username" required maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}" autocomplete="off"></label> <label><span data-password-label>初始密码</span><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label> <fieldset><legend>允许访问的工作区</legend><div data-user-workspaces class="account-workspaces"></div> <input name="workspacePath" type="hidden"> <button type="button" data-open-directory>添加目录</button> <small data-selected-directory>未选择新目录。点击“添加目录”后从服务器目录树中选择。</small> </fieldset> <small>列表中的目录可直接勾选；也可以通过“添加目录”从服务器目录树中选择新目录。</small> <small>保存修改会使该用户的所有登录失效；用户重新登录后生效。</small> <div class="account-form-actions"><button type="submit" class="account-primary">保存用户</button><button type="button" data-user-delete hidden>删除用户</button></div> </fieldset> </form> <p role="status" aria-live="polite" data-user-status></p> </section> </div> <dialog data-directory-dialog> <form method="dialog" data-directory-form><h2>选择服务器目录</h2><p class="account-directory-current"><span>当前位置</span><code data-directory-current aria-live="polite">加载目录中…</code></p><div class="account-form-actions"><button type="button" data-directory-up>上一级</button></div><div data-directory-list class="account-directory-list" role="tree" aria-label="服务器目录"></div><div class="account-form-actions"><button value="cancel">取消</button><button value="confirm" class="account-primary">选择此目录</button></div></form> </dialog> <dialog data-delete-dialog> <form method="dialog"><h2>删除用户？</h2><p>用户将立即退出登录。已有会话不会转交给其他用户。</p><p data-delete-name></p><div class="account-form-actions"><button value="cancel">取消</button><button value="confirm" class="account-danger">确认删除</button></div></form> </dialog> </div>  <p role="alert" aria-live="polite" data-account-error></p> </main> </body></html> <script type="module" src="/assets/users.astro_astro_type_script_index_0_lang.BJlp1f1z.js"></script>
