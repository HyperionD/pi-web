<!DOCTYPE html><html lang="zh-CN" class="account-document"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>用户管理 · pi-web</title><link rel="stylesheet" href="/assets/styles.ByCxPsje.css">
<link rel="stylesheet" href="/assets/AccountLayout.71ah2lqD.css"></head> <body class="account-page"> <main class="account-main">   <div data-users-content hidden> <div class="account-heading"><div><h1>用户管理</h1><p>管理账号、部门与工作区访问权限。共享工作区内的文件仍然共享。</p></div><a href="/">返回会话</a></div> <section class="account-card account-users-card"> <div class="account-list-head"><div><h2>用户列表 <small data-users-count>0</small></h2><p class="account-section-hint">管理账号、显示名称、部门与工作区访问权限。</p></div><div class="account-list-actions"><a href="/api/admin/users/import-template" download>下载导入模板</a><button type="button" data-user-import>批量导入</button><button type="button" data-user-new class="account-primary">新增用户</button></div></div> <p data-users-status role="status" aria-live="polite"></p> <div class="account-toolbar"><label class="account-search">搜索用户<input data-user-search type="search" placeholder="搜索账号、用户名或部门" autocomplete="off"></label><input data-user-import-input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden><label class="account-page-size">每页显示<select data-user-page-size aria-label="每页显示条数"><option value="10" selected>10 条</option><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label><div class="account-batch" data-account-batch hidden><span data-batch-count>0 个用户</span><button type="button" data-batch-open>批量授权工作区</button></div></div> <div class="account-table-wrap"><table class="account-users-table"><caption class="sr-only">用户账号列表</caption><thead><tr><th scope="col"><span class="sr-only">选择</span></th><th scope="col">账号</th><th scope="col">用户名</th><th scope="col">部门</th><th scope="col">状态</th><th scope="col">工作区</th><th scope="col" class="account-actions-heading">操作</th></tr></thead><tbody data-users-list></tbody></table><p data-users-empty>暂无匹配用户。</p></div> <div class="account-pagination"><button type="button" data-users-prev>上一页</button><span data-users-page>第 1 页</span><button type="button" data-users-next>下一页</button></div> </section> <dialog data-batch-dialog class="account-batch-dialog" aria-labelledby="batch-dialog-title"> <form data-batch-form> <div class="account-dialog-head"><div><p class="account-eyebrow">批量操作</p><h2 id="batch-dialog-title">批量授权工作区</h2></div><button type="button" data-batch-cancel class="account-icon-button" aria-label="关闭">×</button></div> <p class="account-batch-target">将授权给 <strong data-batch-target-count>0 个用户</strong>。</p> <p data-batch-selected-path class="account-batch-selected-path">尚未选择工作区。</p> <button type="button" data-batch-open-directory class="account-primary">选择服务器文件夹</button> <p data-batch-status role="status" aria-live="polite"></p> <div class="account-form-actions"><span></span><button type="button" data-batch-cancel>取消</button><button type="submit" data-batch-submit class="account-primary">确认授权</button></div> </form> </dialog> <dialog data-user-dialog class="account-user-dialog" aria-labelledby="user-dialog-title"> <form data-user-form> <div class="account-dialog-head"><div><p class="account-eyebrow">账号设置</p><h2 id="user-dialog-title" data-user-form-title>新增用户</h2></div><button type="button" data-user-cancel class="account-icon-button" aria-label="关闭">×</button></div> <fieldset data-user-fields> <div class="account-form-grid"><label>账号<input name="account" required maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}" autocomplete="off"></label><label>用户名<input name="username" required maxlength="80" autocomplete="off"></label><label>部门<input name="department" maxlength="80" autocomplete="organization"></label></div> <label><span data-password-label>初始密码</span><input name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label> <label class="account-status-toggle"><input name="disabled" type="checkbox"> 禁用账号</label> <fieldset><legend>允许访问的工作区</legend><div data-user-workspaces class="account-workspaces"></div><input name="workspacePath" type="hidden"><button type="button" data-open-directory>添加目录</button><small data-selected-directory>未选择新目录。点击“添加目录”后从服务器目录树中选择。</small></fieldset> <small>保存修改会使该用户的所有登录失效；用户重新登录后生效。</small> <div class="account-form-actions"><button type="button" data-user-delete hidden class="account-danger">删除用户</button><span></span><button type="button" data-user-cancel>取消</button><button type="submit" class="account-primary">保存用户</button></div> </fieldset> </form> <p role="status" aria-live="polite" data-user-status></p> </dialog> <dialog data-directory-dialog> <form method="dialog" data-directory-form><h2>选择服务器目录</h2><p class="account-directory-current"><span>当前位置</span><code data-directory-current aria-live="polite">加载目录中…</code></p><div class="account-form-actions"><button type="button" data-directory-up>上一级</button></div><div data-directory-list class="account-directory-list" role="tree" aria-label="服务器目录"></div><div class="account-form-actions"><button value="cancel">取消</button><button value="confirm" class="account-primary">选择此目录</button></div></form> </dialog> <dialog data-delete-dialog> <form method="dialog"><h2>删除用户？</h2><p>用户将立即退出登录。已有会话不会转交给其他用户。</p><p data-delete-name></p><div class="account-form-actions"><button value="cancel">取消</button><button value="confirm" class="account-danger">确认删除</button></div></form> </dialog> </div>  <p role="alert" aria-live="polite" data-account-error></p> </main> </body></html> <script type="module" src="/assets/users.astro_astro_type_script_index_0_lang.qn9Sb-CT.js"></script>
