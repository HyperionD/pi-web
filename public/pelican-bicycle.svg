<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只戴着小帽子的鹈鹕骑着蓝色自行车，迎风前进。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8DF"/>
      <stop offset="1" stop-color="#FFE9B8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#E7EEF2"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#F6A34A"/>
      <stop offset="1" stop-color="#E87542"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#24445A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="40" fill="url(#sky)"/>
  <path d="M74 425c82-26 143-26 220 0M508 425c73-22 137-22 218 0" fill="none" stroke="#F3C879" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 173h58M82 194h92M624 148h57M646 169h75" fill="none" stroke="#F5C978" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <path d="M190 113c18-16 40-16 58 0M207 97c14-15 30-15 44 0" fill="none" stroke="#F4BD63" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <g filter="url(#soft-shadow)">
    <!-- bicycle wheels -->
    <g fill="#F7FBFC" stroke="#24445A" stroke-width="10">
      <circle cx="222" cy="419" r="83"/>
      <circle cx="594" cy="419" r="83"/>
    </g>
    <g fill="none" stroke="#7BB9CC" stroke-width="4" opacity=".9">
      <path d="M222 336v166M139 419h166M164 361l116 116M164 477l116-116"/>
      <path d="M594 336v166M511 419h166M536 361l116 116M536 477l116-116"/>
    </g>
    <g fill="#F5A34A" stroke="#24445A" stroke-width="7">
      <circle cx="222" cy="419" r="12"/>
      <circle cx="594" cy="419" r="12"/>
    </g>

    <!-- bicycle frame -->
    <g fill="none" stroke="#2F91B5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M222 419h134l72-126h-94z"/>
      <path d="M356 419l-22-126"/>
      <path d="M356 419h238"/>
      <path d="M428 293h73l93 126"/>
    </g>
    <path d="M417 291l-23-35" fill="none" stroke="#24445A" stroke-width="9" stroke-linecap="round"/>
    <path d="M386 252h-51" fill="none" stroke="#24445A" stroke-width="10" stroke-linecap="round"/>
    <path d="M496 292l39-27" fill="none" stroke="#24445A" stroke-width="8" stroke-linecap="round"/>
    <path d="M523 258h45" fill="none" stroke="#24445A" stroke-width="10" stroke-linecap="round"/>
    <circle cx="356" cy="419" r="21" fill="#F5A34A" stroke="#24445A" stroke-width="8"/>
    <path d="M356 419l-33 27M356 419l35-22" fill="none" stroke="#24445A" stroke-width="7" stroke-linecap="round"/>
    <path d="M313 446h-24M391 397h24" fill="none" stroke="#24445A" stroke-width="8" stroke-linecap="round"/>

    <!-- rear basket -->
    <path d="M202 318h83l-10 67h-63z" fill="#F5A34A" stroke="#24445A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M210 333h67M207 350h69M204 367h69" fill="none" stroke="#FFD47E" stroke-width="5"/>
    <path d="M217 315c-7-24 7-43 24-49 19-7 38 4 45 25 6 18-1 28-8 40" fill="#F28D57" stroke="#24445A" stroke-width="7" stroke-linejoin="round"/>
    <path d="M243 272c6 11 13 19 24 27" fill="none" stroke="#FFD47E" stroke-width="5" stroke-linecap="round"/>

    <!-- pelican body -->
    <path d="M332 275c-3-49 17-84 60-103 39-18 100-4 124 32 21 32 6 72-24 92-28 19-70 27-116 20z" fill="url(#body)" stroke="#24445A" stroke-width="10" stroke-linejoin="round"/>
    <!-- tail feathers -->
    <path d="M336 278l-63-24 35 48-55 9 76 20z" fill="#D9E5EA" stroke="#24445A" stroke-width="9" stroke-linejoin="round"/>
    <!-- wing -->
    <path d="M405 188c35 5 65 26 72 55-12 24-35 40-72 46-18-17-25-44-18-69 4-14 9-24 18-32z" fill="#B8D1DA" stroke="#24445A" stroke-width="9"/>
    <path d="M407 205c22 11 38 28 47 50M400 225c22 10 38 24 50 43M397 246c19 7 34 18 45 31" fill="none" stroke="#8EAFBA" stroke-width="6" stroke-linecap="round"/>

    <!-- neck and head -->
    <path d="M374 202c-11-30-4-74 17-93 20-19 53-17 73 2 18 17 21 43 9 66-14 28-38 45-66 48z" fill="url(#body)" stroke="#24445A" stroke-width="10"/>
    <ellipse cx="424" cy="119" rx="50" ry="43" fill="#FFFDF7" stroke="#24445A" stroke-width="10"/>
    <!-- crest -->
    <path d="M393 85c-7-22 8-38 25-19 14-28 34-14 31 11 18-10 29 8 12 27-21 9-47 6-68-19z" fill="#F5A34A" stroke="#24445A" stroke-width="8" stroke-linejoin="round"/>
    <!-- hat -->
    <path d="M385 78c5-31 25-48 53-48 23 0 42 12 51 35-34-5-68 0-104 13z" fill="#2F91B5" stroke="#24445A" stroke-width="9" stroke-linejoin="round"/>
    <path d="M379 78c33-14 75-17 116-8" fill="none" stroke="#F5A34A" stroke-width="12" stroke-linecap="round"/>
    <!-- beak and pouch -->
    <path d="M462 120c54 0 99 22 152 57-37 18-79 22-118 9-23-8-43-23-57-43z" fill="url(#beak)" stroke="#24445A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M461 120c-4 24 9 52 35 66 18 10 38 13 57 10-13 30-50 47-82 30-35-18-49-57-33-91z" fill="#F7A66A" stroke="#24445A" stroke-width="9" stroke-linejoin="round"/>
    <path d="M477 148c31 13 58 20 89 21" fill="none" stroke="#D87349" stroke-width="6" stroke-linecap="round"/>
    <path d="M557 168c14 4 29 7 44 8" fill="none" stroke="#FFD47E" stroke-width="6" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="438" cy="111" r="12" fill="#24445A"/>
    <circle cx="442" cy="107" r="4" fill="#FFFDF7"/>
    <!-- scarf -->
    <path d="M377 168c26 17 55 22 83 12l12 22c-34 18-70 12-101-7z" fill="#E85F5C" stroke="#24445A" stroke-width="8" stroke-linejoin="round"/>
    <path d="M447 194l16 54-26-10-14-49z" fill="#E85F5C" stroke="#24445A" stroke-width="8" stroke-linejoin="round"/>

    <!-- legs and feet -->
    <path d="M390 293c-8 34-14 70-17 105M435 292c-5 38-2 71 14 101" fill="none" stroke="#D98753" stroke-width="13" stroke-linecap="round"/>
    <path d="M373 397c-11 9-19 16-31 17M449 392c13 5 23 10 35 9" fill="none" stroke="#D98753" stroke-width="12" stroke-linecap="round"/>
    <path d="M336 415l-20 5M482 402l20 5" fill="none" stroke="#24445A" stroke-width="8" stroke-linecap="round"/>
    <!-- wing reaching handlebar -->
    <path d="M493 207c18 21 23 48 15 71-7 18-22 26-39 17-12-7-13-23-4-37l19-30" fill="#B8D1DA" stroke="#24445A" stroke-width="9" stroke-linejoin="round"/>
    <path d="M495 281l36-23" fill="none" stroke="#D98753" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- motion accents -->
  <path d="M87 318h62M65 340h43M663 293h52M694 316h32" fill="none" stroke="#E87542" stroke-width="8" stroke-linecap="round"/>
  <path d="M112 489c33 11 61 11 91 0M536 515c33 10 68 10 101-2" fill="none" stroke="#F0B95C" stroke-width="6" stroke-linecap="round" opacity=".8"/>
</svg>
